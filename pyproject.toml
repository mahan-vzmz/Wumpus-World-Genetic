[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wumpus-world-genetic"
version = "8.1.1"
description = "Wumpus World comparison of A*, rule-based, and hybrid genetic agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "artificial-intelligence",
    "genetic-algorithm",
    "wumpus-world",
    "a-star",
    "intelligent-agents"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "matplotlib>=3.8,<4.0"
]

[[project.authors]]
name = "ماهان ورمزیار"
email = "mahan.varmazyar@gmail.com"

[project.urls]
Repository = "https://github.com/mahan-vzmz/Wumpus-World-Genetic"
Documentation = "https://github.com/mahan-vzmz/Wumpus-World-Genetic/tree/main/docs"
Issues = "https://github.com/mahan-vzmz/Wumpus-World-Genetic/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
    "build>=1.2,<2.0"
]
docs = [
    "weasyprint>=68,<69",
    "pypdf>=5,<7"
]

[project.scripts]
wumpus-world = "wumpus_world.cli:main"
wumpus-world-demo = "wumpus_world.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wumpus_world*"]

[tool.setuptools.package-data]
wumpus_world = [
    "data/*.json",
    "data/maps/*.txt"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["."]
