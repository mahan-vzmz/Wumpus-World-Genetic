[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wumpus-world-genetic"
version = "8.1.0"
description = "Wumpus World comparison of A*, rule-based, and hybrid genetic agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wumpus_world*"]

[[project.authors]]
name = "ماهان ورمزیار"
email = "mahan.varmazyar@gmail.com"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0"
]
docs = [
    "weasyprint>=68,<69"
]

[project.scripts]
wumpus-world = "wumpus_world.cli:main"
wumpus-world-demo = "wumpus_world.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
