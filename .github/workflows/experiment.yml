name: Experiment

on:
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e .
      - name: Train Genetic Agent
        run: python train_genetic.py --regenerate-training-maps
      - name: Run Full Experiment
        run: python experiment.py
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wumpus-world-experiment
          path: |
            results/
            best_weights.json
          if-no-files-found: warn
          retention-days: 14
