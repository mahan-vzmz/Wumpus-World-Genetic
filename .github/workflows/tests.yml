name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall -q src tests experiment.py train_genetic.py verify_delivery.py tools/check_repository_consistency.py tools/sync_packaged_weights.py
      - name: Check CLI
        run: wumpus-world --help
      - name: Check demo CLI
        run: wumpus-world-demo

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev,docs]"
      - name: Check committed repository state
        run: python tools/check_repository_consistency.py
      - name: Check packaged weights sync
        run: python tools/sync_packaged_weights.py --check
      - name: Rebuild HTML and PDF reports
        run: python docs/build_artifacts.py --info project_info.public.json
      - name: Verify delivery artifacts
        run: python verify_delivery.py
      - name: Check generated artifacts are committed
        run: |
          git diff --exit-code -- \
            src/wumpus_world/data/best_weights.json \
            docs/assets/ \
            docs/final_report/final_report.html \
            docs/final_report/final_report.pdf \
            docs/final_report/report_manifest.json \
            results/final/run_metadata.json

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip build
      - run: python tools/sync_packaged_weights.py --check
      - run: python -m build
      - run: python -m pip install dist/*.whl

      - name: Test installed CLI outside repository
        run: |
          cd /tmp
          wumpus-world --quiet
          wumpus-world-demo
