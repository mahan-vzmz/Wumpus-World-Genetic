name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall -q src tests experiment.py train_genetic.py verify_delivery.py tools/check_repository_consistency.py
      - name: Check CLI
        run: wumpus-world --help
      - name: Check demo CLI
        run: wumpus-world-demo

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - name: Verify delivery artifacts
        run: python verify_delivery.py
      - name: Check repository consistency
        run: python tools/check_repository_consistency.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl

      - name: Test installed CLI outside repository
        run: |
          cd /tmp
          wumpus-world --quiet
          wumpus-world-demo
